<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="380"
    viewBox="0 0 1200 380"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">File Organizer</title>
    <desc id="description">
        A Python automation tool for organizing files by extension.
    </desc>

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#172554"/>
            <stop offset="100%" stop-color="#312e81"/>
        </linearGradient>

        <linearGradient id="folderGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>

        <linearGradient id="fileGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow
                dx="0"
                dy="14"
                stdDeviation="18"
                flood-color="#020617"
                flood-opacity="0.45"
            />
        </filter>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="28"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="380" rx="32" fill="url(#background)"/>

    <!-- Decorative glow -->
    <circle
        cx="1060"
        cy="60"
        r="130"
        fill="#3b82f6"
        opacity="0.18"
        filter="url(#softGlow)"
    />

    <circle
        cx="150"
        cy="340"
        r="120"
        fill="#8b5cf6"
        opacity="0.16"
        filter="url(#softGlow)"
    />

    <!-- Grid decoration -->
    <g opacity="0.08" stroke="#ffffff">
        <path d="M0 80 H1200"/>
        <path d="M0 160 H1200"/>
        <path d="M0 240 H1200"/>
        <path d="M0 320 H1200"/>
        <path d="M120 0 V380"/>
        <path d="M240 0 V380"/>
        <path d="M360 0 V380"/>
        <path d="M480 0 V380"/>
        <path d="M600 0 V380"/>
        <path d="M720 0 V380"/>
        <path d="M840 0 V380"/>
        <path d="M960 0 V380"/>
        <path d="M1080 0 V380"/>
    </g>

    <!-- Folder illustration -->
    <g transform="translate(85 75)" filter="url(#shadow)">
        <path
            d="M20 65
               Q20 40 45 40
               H115
               L145 72
               H285
               Q310 72 310 97
               V225
               Q310 250 285 250
               H45
               Q20 250 20 225
               Z"
            fill="url(#folderGradient)"
        />

        <path
            d="M20 100
               Q20 78 42 78
               H288
               Q310 78 310 100
               V225
               Q310 250 285 250
               H45
               Q20 250 20 225
               Z"
            fill="#2563eb"
            opacity="0.9"
        />

        <!-- Files -->
        <g transform="translate(75 105) rotate(-8)">
            <rect
                width="105"
                height="125"
                rx="12"
                fill="url(#fileGradient)"
            />
            <rect x="18" y="25" width="68" height="9" rx="4" fill="#60a5fa"/>
            <rect x="18" y="48" width="54" height="8" rx="4" fill="#cbd5e1"/>
            <rect x="18" y="68" width="68" height="8" rx="4" fill="#cbd5e1"/>
            <rect x="18" y="88" width="45" height="8" rx="4" fill="#cbd5e1"/>
        </g>

        <g transform="translate(165 102) rotate(8)">
            <rect
                width="105"
                height="125"
                rx="12"
                fill="url(#fileGradient)"
            />
            <circle cx="52" cy="43" r="19" fill="#8b5cf6"/>
            <path
                d="M22 100 L45 73 L61 89 L73 78 L88 100 Z"
                fill="#60a5fa"
            />
        </g>
    </g>

    <!-- Text -->
    <g transform="translate(455 105)">
        <text
            x="0"
            y="55"
            fill="#ffffff"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="66"
            font-weight="800"
            letter-spacing="-2"
        >
            File Organizer
        </text>

        <text
            x="2"
            y="105"
            fill="#bfdbfe"
            font-family="Inter, Segoe UI, Arial, sans-serif"
            font-size="24"
            font-weight="400"
        >
            Automatically organise your files with Python
        </text>

        <!-- Feature pills -->
        <g transform="translate(0 145)">
            <rect
                x="0"
                y="0"
                width="150"
                height="44"
                rx="22"
                fill="#ffffff"
                opacity="0.1"
                stroke="#ffffff"
                stroke-opacity="0.18"
            />

            <text
                x="75"
                y="29"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Inter, Segoe UI, Arial, sans-serif"
                font-size="16"
                font-weight="600"
            >
                Python 3.14+
            </text>

            <rect
                x="165"
                y="0"
                width="190"
                height="44"
                rx="22"
                fill="#ffffff"
                opacity="0.1"
                stroke="#ffffff"
                stroke-opacity="0.18"
            />

            <text
                x="260"
                y="29"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Inter, Segoe UI, Arial, sans-serif"
                font-size="16"
                font-weight="600"
            >
                Zero Dependencies
            </text>

            <rect
                x="370"
                y="0"
                width="165"
                height="44"
                rx="22"
                fill="#ffffff"
                opacity="0.1"
                stroke="#ffffff"
                stroke-opacity="0.18"
            />

            <text
                x="452"
                y="29"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Inter, Segoe UI, Arial, sans-serif"
                font-size="16"
                font-weight="600"
            >
                Easy to Use
            </text>
        </g>
    </g>

    <!-- Python-style decorative icon -->
    <g transform="translate(1090 285)" opacity="0.75">
        <circle cx="0" cy="0" r="42" fill="#ffffff" opacity="0.08"/>
        <path
            d="M-12 -22
               C-25 -22 -27 -14 -27 -5
               H0
               V1
               H-35
               C-45 1 -50 9 -50 22
               C-50 35 -43 43 -32 43
               H-18
               V31
               C-18 21 -10 13 1 13
               H22
               C32 13 40 5 40 -6
               V-24
               C40 -35 31 -42 21 -42
               H-11
               C-17 -42 -22 -37 -22 -31
               C-22 -26 -18 -22 -12 -22
               Z"
            fill="#60a5fa"
            transform="scale(0.7)"
        />
    </g>
</svg>
